[project]
name = "arctic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex", email = "alexalexbabarika@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "clarabel>=0.11.1",
    "cvxpy>=1.9.3",
    "gurobipy>=14.0.0",
    "highspy>=1.16.0",
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "mosek>=11.2.8",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scs>=3.3.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
